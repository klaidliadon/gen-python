name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Regenerate examples
        run: make -C _examples generate

      - name: Git diff of regenerated files
        run: make -C _examples diff

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install Python dependencies
        run: pip install httpx

      - name: Regenerate examples
        run: make -C _examples generate

      - name: Run tests
        run: make -C _examples test

      - name: Verify streaming is rejected
        run: make -C _examples test-streaming

      - name: Verify keyword identifiers compile
        run: make -C _examples test-keywords
